<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ASETUR Chile - Menú Interactivo</title>
  
  <!-- Tipografías e Iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* Bloqueo estricto de scroll: Single-Viewport */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b1329;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Contenedor Adaptativo Proporcional 900x1700 */
    .viewport-wrapper {
      position: relative;
      height: 100dvh;
      width: calc(100dvh * (900 / 1700));
      max-width: 100vw;
      max-height: calc(100vw * (1700 / 900));
      aspect-ratio: 900 / 1700;
      background: #FFFFFF url('index.jfif') no-repeat center center;
      background-size: 100% 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    /* ========================================================
       1. FOTOGRAMA CINEMATOGRÁFICO DE PAISAJES
       ======================================================== */
    .video-frame-container {
      position: absolute;
      top: 18.2%;
      left: 8%;
      width: 84%;
      height: 23%;
      border-radius: 14px;
      overflow: hidden;
      background-color: #0f172a;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25), 0 0 0 3px #FFFFFF;
      z-index: 5;
    }

    .frame-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      z-index: 1;
      transform: scale(1);
      transition: opacity 1.8s ease-in-out;
      will-change: opacity, transform;
    }

    .frame-slide.is-visible {
      opacity: 1;
      z-index: 2;
      animation: smoothKenBurns 8s ease-out forwards;
    }

    .frame-slide.is-leaving {
      opacity: 0;
      z-index: 1;
      animation: none;
    }

    @keyframes smoothKenBurns {
      0% { transform: scale(1.0); }
      100% { transform: scale(1.08); }
    }

    .video-frame-container::after {
      content: '';
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      z-index: 5;
    }

    /* ========================================================
       2. BOTONERA MODULAR EQUILIBRADA Y CENTRADA
       Espaciado simétrico entre la zona superior y el footer
       ======================================================== */
    .interactive-menu {
      position: absolute;
      top: 49.5%;
      left: 8%;
      width: 84%;
      display: flex;
      flex-direction: column;
      gap: 12px; /* Separación equilibrada */
      z-index: 10;
    }

    .action-btn {
      position: relative;
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background: #FFFFFF;
      border-radius: 16px;
      text-decoration: none;
      border: 1.5px solid #E2E8F0;
      box-shadow: 0 5px 12px rgba(15, 23, 42, 0.06), 0 2.5px 0 #CBD5E1;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s;
      cursor: pointer;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(15, 23, 42, 0.1), 0 2.5px 0 #94A3B8;
    }

    .action-btn:active {
      transform: translateY(1.5px);
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.08), 0 1px 0 #94A3B8;
    }

    .btn-icon-box {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-right: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.12);
      border: 1.5px solid #FFFFFF;
    }

    /* 1. Conócenos */
    .btn-conocenos { border-color: #BAE6FD; }
    .btn-conocenos .btn-icon-box {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #FFFFFF;
    }
    .btn-conocenos .btn-title { color: #0369A1; }

    /* 2. Instagram */
    .btn-instagram { border-color: #FED7AA; }
    .btn-instagram .btn-icon-box {
      background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
      color: #FFFFFF;
    }
    .btn-instagram .btn-title { color: #C13584; }

    /* 3. LinkedIn */
    .btn-linkedin { border-color: #CBD5E1; }
    .btn-linkedin .btn-icon-box {
      background: linear-gradient(135deg, #0a66c2, #004182);
      color: #FFFFFF;
    }
    .btn-linkedin .btn-title { color: #0A66C2; }

    /* 4. Correo */
    .btn-email { border-color: #BBF7D0; }
    .btn-email .btn-icon-box {
      background: linear-gradient(135deg, #10B981, #059669);
      color: #FFFFFF;
    }
    .btn-email .btn-title { color: #047857; }

    .btn-content {
      flex: 1;
      text-align: left;
    }

    .btn-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 13.5px;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.15;
    }

    .btn-subtitle {
      font-size: 10.5px;
      color: #64748B;
      font-weight: 600;
      margin-top: 1.5px;
    }

    /* Cursor de mano interactivo */
    .hand-pointer {
      position: absolute;
      right: 12px;
      bottom: -6px;
      font-size: 18px;
      color: #1e293b;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
      animation: handTap 2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes handTap {
      0%, 100% { transform: translateY(0) rotate(-15deg); }
      50% { transform: translateY(-4px) rotate(-5deg); }
    }

    /* ========================================================
       3. FOOTER FIJO COMPACTO (SEDE DIGITAL VIRTUAL)
       ======================================================== */
    .fixed-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 58px;
      background: linear-gradient(135deg, #0F766E 0%, #0D9488 100%);
      display: flex;
      align-items: center;
      padding: 0 16px;
      box-shadow: 0 -4px 14px rgba(15, 118, 110, 0.25);
      z-index: 10;
      color: #FFFFFF;
    }

    .footer-pin {
      width: 34px;
      height: 34px;
      min-width: 34px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      margin-right: 10px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      animation: pulsePin 2.5s infinite;
    }

    @keyframes pulsePin {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .footer-text h4 {
      font-family: 'Montserrat', sans-serif;
      font-size: 11.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .footer-text p {
      font-size: 9.5px;
      opacity: 0.92;
      font-weight: 600;
      margin-top: 1.5px;
    }

    /* ========================================================
       4. MODAL CONÓCENOS + VOZ EN OFF
       ======================================================== */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(5px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      position: relative;
      background: #FFFFFF;
      width: 100%;
      border-radius: 22px;
      padding: 22px 18px 18px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.3);
      text-align: center;
      transform: scale(0.92);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.open .modal-card { transform: scale(1); }

    .close-modal-btn {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 36px;
      height: 36px;
      background: #EF4444;
      color: #FFFFFF;
